<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>99Food Full Interactive Clone</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --primary: #ffe600;
      --accent: #00a651;
      --text: #1d1d1f;
      --subtext: #6e6e73;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); display: flex; justify-content: center; }

    .app {
      width: 100%; max-width: 430px; background: var(--card-bg); min-height: 100vh;
      display: flex; flex-direction: column; position: relative; padding-bottom: 90px;
    }

    /* Top Header */
    .header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; sticky: top; background: #fff; z-index: 10; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
    .search-box { flex: 1; background: #f2f2f7; border-radius: 20px; padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; }
    .cart-btn { position: relative; cursor: pointer; font-size: 22px; }
    .badge { position: absolute; top: -5px; right: -8px; background: #ff3b30; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }

    /* Chips */
    .chips { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { background: #f2f2f7; padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .chip.active { background: #1d1d1f; color: #fff; }

    /* List */
    .restaurant-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { display: flex; gap: 12px; background: #fff; border-radius: 12px; overflow: hidden; }
    .thumb-wrap { position: relative; width: 96px; height: 96px; flex-shrink: 0; border-radius: 12px; overflow: hidden; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .overlay-status { position: absolute; inset: 0; background: rgba(0,0,0,0.5); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-align: center; }

    .info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
    .info-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .title { font-size: 15px; font-weight: 700; color: var(--text); }
    .fav-btn { cursor: pointer; font-size: 18px; color: #ccc; transition: 0.2s; }
    .fav-btn.active { color: #ff3b30; }

    .sub { font-size: 12px; color: var(--subtext); }
    .tag { align-self: flex-start; background: #e8f7ed; color: var(--accent); font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 4px; }

    /* Cart Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: flex-end; flex-direction: column; z-index: 100; }
    .modal-content { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; max-height: 70vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; margin-bottom: 15px; }

    /* Bottom Navigation */
    .nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 390px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.12); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; padding: 8px; z-index: 20; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--subtext); cursor: pointer; }
    .nav-item.active { color: #000; font-weight: bold; }
    .nav-center { width: 44px; height: 44px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-top: -18px; }
  </style>
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="avatar" onclick="alert('Perfil de Usuário')">👤</div>
      <div class="search-box">
        🔍 <input type="text" id="searchInput" placeholder="Buscar açaí, burger, pizza..." oninput="handleSearch()">
      </div>
      <div class="cart-btn" onclick="toggleCart()">🛒 <span class="badge" id="cartCount">0</span></div>
    </header>

    <div class="chips">
      <div class="chip active" onclick="applyFilter('all', this)">Todos</div>
      <div class="chip" onclick="applyFilter('free', this)">Entrega grátis</div>
      <div class="chip" onclick="applyFilter('promo', this)">Ofertas 40% OFF</div>
      <div class="chip" onclick="applyFilter('fav', this)">Favoritos ❤️</div>
    </div>

    <div class="restaurant-list" id="listContainer"></div>

    <nav class="nav">
      <div class="nav-item" onclick="switchTab(this, 'Corrida')">🚗<span>Corrida</span></div>
      <div class="nav-center" onclick="alert('Opções de entrega rápida')">↑</div>
      <div class="nav-item active" onclick="switchTab(this, 'Entrega')">🛍️<span>Entrega</span></div>
      <div class="nav-item" onclick="switchTab(this, 'Pay')">💳<span>Pay</span></div>
    </nav>

    <div class="modal" id="cartModal" onclick="toggleCart()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>Seu Carrinho</h3>
          <span style="cursor:pointer;" onclick="toggleCart()">✕</span>
        </div>
        <div id="cartItems"><p style="color: #888;">Seu carrinho está vazio.</p></div>
      </div>
    </div>
  </div>

  <script>
    const database = [
      { id: 1, name: 'chef gourmet', category: 'Pizza', dist: '2.6km', promo: '40% OFF', open: '11:00', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=150', isFav: false, isFree: false },
      { id: 2, name: 'Hot dog Jesus reina', category: 'Lanches', dist: '2.6km', promo: '40% OFF', open: '18:30', img: 'https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=150', isFav: false, isFree: false },
      { id: 3, name: 'República dos sabores', category: 'Lanches', dist: '0.9km', promo: 'Até 20% OFF', open: '19:00', img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150', isFav: true, isFree: true },
      { id: 4, name: 'Quintal do Açaí', category: 'Açaí', dist: '0.9km', promo: '40% OFF', open: '11:31', img: 'https://images.unsplash.com/photo-1590301157890-4810ed352733?w=150', isFav: false, isFree: true },
      { id: 5, name: 'Churrasco do Chef', category: 'Brasileira', dist: '2.8km', promo: 'Até 22% OFF', open: '10:00', img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=150', isFav: false, isFree: false }
    ];

    let state = { items: database, cart: [], activeFilter: 'all', searchKeyword: '' };

    function render() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      let filtered = state.items.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(state.searchKeyword) || item.category.toLowerCase().includes(state.searchKeyword);
        if (state.activeFilter === 'free') return matchesSearch && item.isFree;
        if (state.activeFilter === 'promo') return matchesSearch && item.promo.includes('40%');
        if (state.activeFilter === 'fav') return matchesSearch && item.isFav;
        return matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 20px; color: #888;">Nenhum estabelecimento encontrado.</p>';
        return;
      }

      filtered.forEach(item => {
        container.innerHTML += `
          <div class="card">
            <div class="thumb-wrap">
              <img src="${item.img}" alt="${item.name}">
              <div class="overlay-status">Abre às<br>${item.open}</div>
            </div>
            <div class="info">
              <div class="info-head">
                <span class="title">${item.name}</span>
                <span class="fav-btn ${item.isFav ? 'active' : ''}" onclick="toggleFav(${item.id})">♥</span>
              </div>
              <div class="sub">${item.category} • ${item.dist} ${item.isFree ? '• <b>Entrega Grátis</b>' : ''}</div>
              <div class="tag">🏷️ ${item.promo}</div>
              <button onclick="addToCart('${item.name}')" style="margin-top:4px; padding: 4px; border:none; background:#eee; border-radius:4px; cursor:pointer; font-size:11px;">+ Adicionar Item</button>
            </div>
          </div>
        `;
      });
    }

    function toggleFav(id) {
      const target = state.items.find(i => i.id === id);
      if (target) target.isFav = !target.isFav;
      render();
    }

    function applyFilter(filter, el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      state.activeFilter = filter;
      render();
    }

    function handleSearch() {
      state.searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      render();
    }

    function addToCart(itemName) {
      state.cart.push(itemName);
      document.getElementById('cartCount').innerText = state.cart.length;
      updateCartModal();
    }

    function updateCartModal() {
      const cartContainer = document.getElementById('cartItems');
      if (state.cart.length === 0) {
        cartContainer.innerHTML = '<p style="color: #888;">Seu carrinho está vazio.</p>';
      } else {
        cartContainer.innerHTML = state.cart.map((item, idx) => `<p style="padding: 6px 0; border-bottom: 1px solid #eee;">1x ${item}</p>`).join('');
      }
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function switchTab(el, tabName) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
    }

    render();
  </script>
</body>
</html>
