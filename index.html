<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>99Food - Super Ofertas Relâmpago ⚡</title>
  <style>
    :root {
      --bg: #f4f4f6;
      --card-bg: #ffffff;
      --primary: #ff003b; /* Vermelho agressivo de promoção */
      --yellow: #ffe600;
      --accent: #00a651;
      --text: #111111;
      --subtext: #6e6e73;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); display: flex; justify-content: center; }

    .app {
      width: 100%; max-width: 430px; background: var(--card-bg); min-height: 100vh;
      display: flex; flex-direction: column; position: relative; padding-bottom: 90px;
    }

    /* Promo Top Banner */
    .promo-header {
      background: linear-gradient(135deg, #ff003b, #ff5e00);
      color: #fff; padding: 10px 16px; text-align: center; font-size: 13px; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center;
    }
    .timer { background: rgba(0, 0, 0, 0.25); padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 14px; }

    /* Main Header */
    .header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: #fff; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #eee; }
    .search-box { flex: 1; background: #f2f2f7; border-radius: 20px; padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; }
    .cart-btn { position: relative; cursor: pointer; font-size: 22px; }
    .badge { position: absolute; top: -5px; right: -8px; background: var(--primary); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }

    /* Chips Filter */
    .chips { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { background: #f2f2f7; padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .chip.active { background: var(--primary); color: #fff; }

    /* Restaurant/Product List */
    .promo-list { padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { display: flex; gap: 12px; background: #fff; border-radius: 14px; padding: 8px; border: 1px solid #f0f0f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    
    .thumb-wrap { position: relative; width: 105px; height: 105px; flex-shrink: 0; border-radius: 10px; overflow: hidden; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .discount-badge { position: absolute; top: 6px; left: 6px; background: var(--primary); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }

    .info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .info-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .title { font-size: 15px; font-weight: 800; color: var(--text); }
    .fav-btn { cursor: pointer; font-size: 18px; color: #ccc; transition: 0.2s; }
    .fav-btn.active { color: var(--primary); }

    .price-tag { display: flex; align-items: baseline; gap: 6px; margin: 4px 0; }
    .current-price { font-size: 18px; font-weight: 900; color: var(--primary); }
    .old-price { font-size: 12px; color: var(--subtext); text-decoration: line-through; }

    .add-btn { background: var(--yellow); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; color: #000; width: 100%; text-align: center; }
    .add-btn:active { transform: scale(0.98); }

    /* Modal Cart */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: flex-end; flex-direction: column; z-index: 100; }
    .modal-content { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; max-height: 70vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

    /* Bottom Nav */
    .nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 390px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; padding: 8px; z-index: 20; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--subtext); cursor: pointer; }
    .nav-item.active { color: #000; font-weight: bold; }
    .nav-center { width: 44px; height: 44px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-top: -18px; }
  </style>
</head>
<body>

  <div class="app">
    <!-- Relógio de Escassez -->
    <div class="promo-header">
      <span>🔥 SUPER PROMOÇÕES EXCLUSIVAS</span>
      <div class="timer" id="countdown">14:59</div>
    </div>

    <!-- Header com Busca -->
    <header class="header">
      <div class="search-box">
        🔍 <input type="text" id="searchInput" placeholder="Buscar oferta do dia..." oninput="handleSearch()">
      </div>
      <div class="cart-btn" onclick="toggleCart()">🛒 <span class="badge" id="cartCount">0</span></div>
    </header>

    <!-- Filtros de Ofertas -->
    <div class="chips">
      <div class="chip active" onclick="applyFilter('all', this)">⚡ Todas as Ofertas</div>
      <div class="chip" onclick="applyFilter('under20', this)">Até R$ 20</div>
      <div class="chip" onclick="applyFilter('fav', this)">Favoritos ❤️</div>
    </div>

    <!-- Lista de Combos e Produtos -->
    <div class="promo-list" id="listContainer"></div>

    <!-- Navbar Flutuante -->
    <nav class="nav">
      <div class="nav-item" onclick="switchTab(this)">🚗<span>Corrida</span></div>
      <div class="nav-center" onclick="alert('Super Ofertas ativas!')">⚡</div>
      <div class="nav-item active" onclick="switchTab(this)">🛍️<span>Ofertas</span></div>
      <div class="nav-item" onclick="switchTab(this)">💳<span>Pay</span></div>
    </nav>

    <!-- Modal Carrinho -->
    <div class="modal" id="cartModal" onclick="toggleCart()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>Suas Ofertas Selecionadas</h3>
          <span style="cursor:pointer; font-weight:bold;" onclick="toggleCart()">✕</span>
        </div>
        <div id="cartItems"><p style="color: #888;">Nenhum item adicionado ainda.</p></div>
      </div>
    </div>
  </div>

  <script>
    // Base de dados exclusiva para os 5 itens com foco em promoções agressivas
    const database = [
      { id: 1, name: 'Pizza Grande + Guaraná 2L', category: 'Pizza + refrigerante', price: 29.90, oldPrice: 65.00, discount: '54% OFF', priceNum: 29.90, img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=200', isFav: false },
      { id: 2, name: 'Combo Burger Duplo + Fritas G', category: 'Combo lanche+batata', price: 18.90, oldPrice: 42.00, discount: '55% OFF', priceNum: 18.90, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200', isFav: false },
      { id: 3, name: 'Açaí 500ml + 3 Acompanhamentos', category: 'Açaí', price: 11.90, oldPrice: 24.00, discount: '50% OFF', priceNum: 11.90, img: 'https://images.unsplash.com/photo-1590301157890-4810ed352733?w=200', isFav: false },
      { id: 4, name: 'Caixa com 10 Mini Esfihas', category: 'Mini esphirra', price: 14.90, oldPrice: 35.00, discount: '57% OFF', priceNum: 14.90, img: 'https://images.unsplash.com/photo-1541518763669-27fef04b14e8?w=200', isFav: false },
      { id: 5, name: 'Combo Sushi Express (16 peças)', category: 'Sushi', price: 32.90, oldPrice: 68.00, discount: '51% OFF', priceNum: 32.90, img: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=200', isFav: false }
    ];

    let state = { items: database, cart: [], activeFilter: 'all', searchKeyword: '' };

    function render() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      let filtered = state.items.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(state.searchKeyword) || item.category.toLowerCase().includes(state.searchKeyword);
        if (state.activeFilter === 'under20') return matchesSearch && item.priceNum <= 20;
        if (state.activeFilter === 'fav') return matchesSearch && item.isFav;
        return matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 20px; color: #888;">Nenhuma promoção encontrada.</p>';
        return;
      }

      filtered.forEach(item => {
        container.innerHTML += `
          <div class="card">
            <div class="thumb-wrap">
              <img src="${item.img}" alt="${item.name}">
              <div class="discount-badge">${item.discount}</div>
            </div>
            <div class="info">
              <div>
                <div class="info-head">
                  <span class="title">${item.name}</span>
                  <span class="fav-btn ${item.isFav ? 'active' : ''}" onclick="toggleFav(${item.id})">♥</span>
                </div>
                <div class="price-tag">
                  <span class="current-price">R$ ${item.price.toFixed(2).replace('.', ',')}</span>
                  <span class="old-price">R$ ${item.oldPrice.toFixed(2).replace('.', ',')}</span>
                </div>
              </div>
              <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">PEGAR OFERTA ⚡</button>
            </div>
          </div>
        `;
      });
    }

    function toggleFav(id) {
      const target = state.items.find(i => i.id === id);
      if (target) target.isFav = !target.isFav;
      render();
    }

    function applyFilter(filter, el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      state.activeFilter = filter;
      render();
    }

    function handleSearch() {
      state.searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      render();
    }

    function addToCart(itemName, price) {
      state.cart.push({ name: itemName, price: price });
      document.getElementById('cartCount').innerText = state.cart.length;
      updateCartModal();
    }

    function updateCartModal() {
      const cartContainer = document.getElementById('cartItems');
      if (state.cart.length === 0) {
        cartContainer.innerHTML = '<p style="color: #888;">Nenhum item adicionado ainda.</p>';
      } else {
        let total = state.cart.reduce((sum, item) => sum + item.price, 0);
        let itemsHTML = state.cart.map(item => `
          <div style="display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size:14px;">
            <span>1x ${item.name}</span>
            <b>R$ ${item.price.toFixed(2).replace('.', ',')}</b>
          </div>
        `).join('');
        
        itemsHTML += `
          <div style="display:flex; justify-content:space-between; padding-top: 15px; font-weight:bold; font-size:16px;">
            <span>Total com Desconto:</span>
            <span style="color: var(--primary)">R$ ${total.toFixed(2).replace('.', ',')}</span>
          </div>
          <button onclick="alert('Pedido enviado com sucesso!')" style="width:100%; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-top:15px; cursor:pointer;">FINALIZAR COM DESCONTO</button>
        `;
        cartContainer.innerHTML = itemsHTML;
      }
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function switchTab(el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
    }

    // Timer regressivo simples para criar gatilho de escassez
    let time = 899;
    setInterval(() => {
      let minutes = Math.floor(time / 60);
      let seconds = time % 60;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      document.getElementById('countdown').innerHTML = `${minutes}:${seconds}`;
      if (time > 0) time--;
    }, 1000);

    render();
  </script>
</body>
</html>
